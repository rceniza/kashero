services:
  kashero:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    working_dir: /workspace
    volumes:
      - .:/workspace
      - kashero_node_modules:/workspace/node_modules
    environment:
      EXPO_NO_TELEMETRY: "1"
    command: ["bun", "run", "check"]

volumes:
  kashero_node_modules:
    name: kashero_bun_130_node_modules
